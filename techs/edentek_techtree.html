  * { box-sizing: border-box; }

  .empty { color: var(--muted); }

  /* ---- OP2 theme details (beyond colours) ---- */

    box-shadow: inset 2px 2px 0 #fff, inset -2px -2px 0 #404040; }
  [data-theme="op2"] #viewport { border-right: 3px solid var(--op2-silver); }
  [data-theme="op2"] select, [data-theme="op2"] input { background: #000; color: var(--text); border: 2px inset #808080; border-radius: 0; }
  /* Buttons styled like the in-game ASSIGN / STOP buttons */
  [data-theme="op2"] .seg { border: 0; gap: 4px; overflow: visible; }
  [data-theme="op2"] .seg button, [data-theme="op2"] #theme {
    background: #000; color: var(--op2-red); border: 1px solid var(--op2-red-dim); border-radius: 0;

  [data-theme="op2"] .seg button.on { background: #2a0000; color: #ff6a6a; border-color: var(--op2-red); font-weight: 700; }
  [data-theme="op2"] #theme:hover, [data-theme="op2"] .seg button:hover { border-color: var(--op2-red); }
  /* Cards like the command panel's research boxes: square, thin green frame, faint glow */
  [data-theme="op2"] .node { border-radius: 0; border: 1px solid var(--line); border-left: 3px solid var(--cat);
    box-shadow: inset 0 0 8px rgba(0,255,0,.08); }
  [data-theme="op2"] .node img { border: 1px solid #1f8a1f; border-radius: 2px; box-shadow: 0 0 4px rgba(0,255,0,.35); }
  [data-theme="op2"] .node .n { color: #00ff00; font-weight: 700; }
  [data-theme="op2"] .node .m { color: #3cc43c; }
  [data-theme="op2"] .node .lab { color: #00ff00; }
  [data-theme="op2"] .node:hover, [data-theme="op2"] .node.sel { border-color: #00ff00; box-shadow: 0 0 6px rgba(0,255,0,.45); transform: none; }
  [data-theme="op2"] .era span { color: #00c000; font-weight: 700; }
  [data-theme="op2"] aside { border-left: 0; }
  [data-theme="op2"] aside h2 { color: #00ff00; }
  [data-theme="op2"] aside h3 { color: #00c000; }
  [data-theme="op2"] aside .chip { border: 1px solid var(--line); border-radius: 0; background: #000; }

nowledge of the possible resources and hazards of this part of space.  It can provide the basis for future research.","teaser":"Astronomy is the study of matter and energy in the universe, particularly the composition and movement of celestial bodies.  Prior to our hurried departure, our astronomical database contained a great deal of information on nearby star systems and the local region of space.  This database was corrupted and must be rebuilt.","improve":"","req":["02000"],"props":[]},{"id":"02702","name":"Boptronics","cat":1,"eden":400,"ply":400,"sci":5,"lab":1,"desc":"Our boptronics database has been restored.  We will soon be able to develop new processes, techniques, and devices.","teaser":"\u0027Boptronics\u0027 refers to hybrid devices and systems which use electronic, biological and optical components.  Our colony is entirely dependent on this type of equipment, but our database of boptronic engineering techniques has been damaged.  Reassembling this data is a top priority for our survival.","improve":"","req":["02000"],"props":[]},{"id":"02703","name":"Chemistry","cat":1,"eden":400,"ply":400,"sci":5,"lab":1,"desc":"The chemical database has been reconstructed, and will provide the foundation of future scientific progress.","teaser":"The science of chemistry investigates the composition and properties of materials.  Our databases contained all of Earth\u0027s knowledge of chemistry, as well as the results of many experiments carried out since we landed on New Terra; our studies in analytical chemistry, examining the composition of materials in the New Terrestrial soil are particularly valuable.  This chemical database must now be rebuilt.","improve":"","req":["02000"],"props":[]},{"id":"02704","name":"Planetary Sciences","cat":1,"eden":400,"ply":400,"sci":5,"lab":1,"desc":"Our planetary sciences database has been reassembled.","teaser":"The planetary sciences data bank included studies of the soil, landforms, and atmosphere of New Terra, as well as all geoscientific research done on Earth and the solar system prior to the planet\u0027s destruction.  Restoration of this database is essential to our continued survival on New Terra.","improve":"","req":["02000"],"props":[]},{"id":"02705","name":"Social Sciences","cat":1,"eden":400,"ply":400,"sci":5,"lab":1,"desc":"Reclamation of the social sciences database is complete.","teaser":"Our knowledge of psychology, sociology, economics, politics, and the other social sciences enable us to maintain the happiness and productivity of the colonists.  We must reconstruct this data to maintain order and civility.","improve":"","req":["02000"],"props":[]},{"id":"03000","name":"Tech Level 3","cat":0,"eden":0,"ply":0,"sci":0,"lab":0,"desc":"","teaser":"","improve":"","req":[],"props":[]},{"id":"03101","name":"Standard Lab","cat":0,"eden":0,"ply":0,"sci":0,"lab":0,"desc":"","teaser":"","improve":"","req":["03000"],"props":[]},{"id":"03301","name":"Emergency Response Systems","cat":11,"eden":1000,"ply":1000,"sci":10,"lab":2,"desc":"Structure Factories may now produce DIRT structure kits.  _______________________________________ Disaster Instant Response Teams (DIRTs) can reduce damage to structures.  Once the DIRT structure has been deployed, DIRT members trained in emergency medical care and structural reinforcement will be on the scene in a matter of seconds.","teaser":"Allows production of DIRT structure kits at the Structure Factory.  _______________________________________  Given the new dangers confronting our colony, we need more protection against disaster than our emergency shelters are able to provide.  Unfortunately, those colonists trained in emergency response were killed before we could evacuate Eden.  This project will develop new methods, tools, and techniques to respond to structural damage.","improve":"","req":["03000"],"props":[]},{"id":"03302","name":"Metals Reclamation","cat":6,"eden":800,"ply":800,"sci":10,"lab":2,"desc":"Structure Factories may now produce GORF structure kits.  _______________________________________ The Garbage and Ore Recycling Facility (GORF) uses a variant of the hot-cracking technology used at the Common Ore Smelter to extract usable Metals from deconstructed structures, unneeded structure kits, and rubble.","teaser":"Allows production of GORF structure kits at the Structure Factory.  _______________________________________  With our growing needs, we can no longer afford to overlook any possible sources of Metals.  A few adaptations to our current Smelter technology may enable us to reclaim some of the materials in structures we no longer need.","improve":"","req":["03000"],"props":[]},{"id":"03303","name":"Health Maintenance","cat":11,"eden":600,"ply":600,"sci":6,"lab":2,"desc":"Structure Factories may now produce Medical Center structure kits.  _______________________________________ Medical Center personnel are trained in a variety of techniques of preventive medicine as well as the treatment of illness and injury.  Each Medical Center can support the health needs of up to 40 colonists, improving the health and morale of the colony.","teaser":"Allows production of Medical Center structure kits at the Structure Factory.  _______________________________________ Although our emergency medical systems are adequate to deal with accidents and disasters, our people are suffering from a lack of regular medical care.  We could exploit the vast medical knowledge in our databases to develop a regimen of health maintenance practices.","improve":"","req":["03000"],"props":[]},{"id":"03304","name":"Nursery","cat":0,"eden":0,"ply":0,"sci":0,"lab":0,"desc":"","teaser":"","improve":"","req":["03000"],"props":[]},{"id":"03305","name":"University","cat":0,"eden":0,"ply":0,"sci":0,"lab":0,"desc":"","teaser":"","improve":"","req":["03000"],"props":[]},{"id":"03401","name":"Cybernetic Teleoperation","cat":4,"eden":800,"ply":800,"sci":10,"lab":2,"desc":"Structure Factories may now produce Vehicle Factory and Robot Command Center structure kits.  _______________________________________ Our research has resulted in a specialized variant of the Command Center, with dedicated computers and communications capabilities.  In addition, all vehicle designs now include the less expensive Noesis computer, utilizing elements of the Savant technology.  This transfers much of the computing burden from the Robot Command Center to the vehicle itself.","teaser":"Allows production of Robot Command Center and Vehicle Factory structure kits at the Structure Factory.  _______________________________________ Prior to the evacuation from our original colony site, Workers remotely operated our vehicles using a technology called Teleoperation.  Since the catastrophe, we no longer have enough Workers to teleoperate our vehicles.  The Savant computers at the Command Center have taken on part of this burden, but the job is taxing their capacity.  We need a specialized computer vehicle control system.  This Cybernetic Teleoperation project should allows us to operate a much larger number of vehicles.","improve":"","req":["03000"],"props":[]},{"id":"03402","name":"High-Temperature Superconductivity","cat":3,"eden":1200,"ply":1200,"sci":12,"lab":2,"desc":"Tokamak Power output increased. _______________________________________ Our research into High-Temperature Superconductivity has resulted in the discovery of an alloy that is superconducting at 236 degrees Kelvin (-37 degrees Celsius), over 80 degrees higher than previous superconductors, improving power generation at our Tokamaks.","teaser":"Increases Tokamak Power output.  _______________________________________ Superconductivity is the ability of certain materials to conduct electric current with no resistance and extremely low losses.  The best superconductive materials we have require an operating temperature of 152 degrees Kelvin (-121 degrees Celsius). Many new applications could be developed with a significant increase in the temperature of superconduction.","improve":"Increased Power output","req":["03000"],"props":[["TOKAMAK","Production_Capacity","300"]]},{"id":"03403","name":"Hydroponic Growing Media","cat":5,"eden":1500,"ply":1500,"sci":10,"lab":2,"desc":"Food production increased.  _______________________________________ By adjusting the nutrients in the liquid in which our hydroponic crops are grown, we have been able to increase production at our Agridomes by 25%.","teaser":"Increases Food production. _______________________________________ Our Agridomes use a variety of methods, including Hydroponics (soilless farming) to fill our Food requirements.  Some of our Agricultural Workers have ideas on ways to improve the growing medium in which our Hydroponic crops are grown.","improve":"Increased Food production","req":["03000"],"props":[["AGRIDOME","Production_Capacity","50"]]},{"id":"03405","name":"Metallogeny","cat":6,"eden":1200,"ply":1200,"sci":12,"lab":2,"desc":"Common Ore Mine yield increased.  _______________________________________ Our Metallogenic research has developed a new technique of locating and exploiting veins of Ore.  This new method has increased Common Ore production.","teaser":"Increases Common Ore Mine yield.  _______________________________________ Metallogeny is the branch of geology that seeks to define the relationship between the geological history of an area and its mineral deposits. Metallogenic research is aimed at achieving a better understanding of the nature and geological settings of base and precious metal deposits, and to use this understanding to help develop areas of high mineral potential.","improve":"Improved Common Ore yield","req":["03000"],"props":[["MINE","Improved","1"]]},{"id":"03406","name":"Environmental Psychology","cat":9,"eden":1500,"ply":1500,"sci":12,"lab":2,"desc":"Residence capacity increased.  _______________________________________ Our expanded knowledge of the causes and effects of crowding and environmental and situational stressors has enabled us to redesign our Residences.  We can now house more people in the same space, while improving Morale.","teaser":"Increases Residence capacity.  _______________________________________ Environmental Psychology studies the relationships between human behaviors and the environments in which they occur.  The forced evacuation of our old colony site has increased the stress on our Colonists; additional research in this field may help us to create a more supportive environment and improve Morale.","improve":"Increased Colonist capacity","req":["03000"],"props":[["RESIDENCE","Production_Capacity","35"]]},{"id":"03501","name":"Robot Command Center","cat":0,"eden":0,"ply":0,"sci":0,"lab":0,"desc":"","teaser":"","improve":"","req":["03401"],"props":[]},{"id":"03502","name":"Vehicle Factory","cat":0,"eden":0,"ply":0,"sci":0,"lab":0,"desc":"","teaser":"","improve":"","req":["03401"],"props":[]},{"id":"03601","name":"Scout","cat":0,"eden":0,"ply":0,"sci":0,"lab":0,"desc":"","teaser":"","improve":"","req":["03502"],"props":[]},{"id":"03602","name":"Large-Scale Optical Resonators","cat":7,"eden":1200,"ply":1200,"sci":12,"lab":2,"desc":"The Laser weapon is now available.  Structure Factories may now produce Guard Post structure kits.  _______________________________________ Industrial laser torches provided the model for the Laser turret, whose large-scale optical resonators are capable of generating a beam that can slice through enemy targets quite easily.","teaser":"Makes the Laser weapon available.  Allows production of Guard Post structure kits at the Structure Factory.  _______________________________________ Satellite observation indicates several of Chairman Nguyen\u0027s armed vehicles and guard posts still function at the old colony site.  The full plans for these were not in the databases we brought from Eden, so we must recreate the technology.  The key development will be the design of an optical resonator large enough to produce a weapons-strength beam.","improve":"","req":["03000"],"props":[]},{"id":"03604","name":"Cargo Truck","cat":0,"eden":0,"ply":0,"sci":0,"lab":0,"desc":"","teaser":"","improve":"","req":["03502"],"props":[]},{"id":"03605","name":"Construction Vehicle","cat":0,"eden":0,"ply":0,"sci":0,"lab":0,"desc":"","teaser":"","improve":"","req":["03502"],"props":[]},{"id":"03606","name":"Earthworks Constructor","cat":0,"eden":0,"ply":0,"sci":0,"lab":0,"desc":"","teaser":"","improve":"","req":["03502"],"props":[]},{"id":"03607","name":"Evacuation Transport","cat":0,"eden":0,"ply":0,"sci":0,"lab":0,"desc":"","teaser":"","improve":"","req":["03502"],"props":[]},{"id":"03608","name":"Robo-Dozer","cat":0,"eden":0,"ply":0,"sci":0,"lab":0,"desc":"","teaser":"","improve":"","req":["03502"],"props":[]},{"id":"03609","name":"Robo-Miner","cat":0,"eden":0,"ply":0,"sci":0,"lab":0,"desc":"","teaser":"","improve":"","req":["03502"],"props":[]},{"id":"03610","name":"Robo-Surveyor","cat":0,"eden":0,"ply":0,"sci":0,"lab":0,"desc":"","teaser":"","improve":"","req":["03502"],"props":[]},{"id":"03801","name":"Guard Post","cat":0,"eden":0,"ply":0,"sci":0,"lab":0,"desc":"","teaser":"","improve":"","req":["03602"],"props":[]},{"id":"03851","name":"Mobile Weapons Platform","cat":4,"eden":1400,"ply":1400,"sci":12,"lab":2,"desc":"Vehicle Factories may now produce Lynx.  _______________________________________ The \u0027Lynx\u0027 light combat chassis is a design adapted from existing vehicles.  The Lynx includes light armor-plating and a weapons hard point, to which a Laser turret (or any other weapons system we develop) may be attached.","teaser":"Allows production of Lynx at the Vehicle Factory.  _______________________________________ While our Command Center staff is quite pleased with the new Guard Post/Laser structures, they point out that our defenses are rather inflexible, due to their lack of mobility.  At their suggestion, our Scientists have outlined a project for developing a mobile weapons platform, which can be armed with the Laser turret.","improve":"","req":["03601","03602"],"props":[]},{"id":"03901","name":"Advanced Vehicle Power Plant","cat":4,"eden":1500,"ply":1500,"sci":12,"lab":2,"desc":"Cargo Truck, Robo-Dozer, and Earthworker speeds improved.  _______________________________________ The new R-3000 series cool-fusion plant has been installed in all Cargo Trucks, Robo-Dozers, and Earthworkers, replacing the earlier R-2000 model.  This application of the High-Temperature Superconductivity technology has increased the speed of these three vehicles.","teaser":"Increases speeds of the Cargo Truck, Robo-Dozer, and Earthworker.  _______________________________________ Several of the vehicle models we use are powered by the R-2000 cool-fusion plant.  Our work in High-Temperature Superconductivity may be applicable to an improvement of this power plant.","improve":"Increased speed","req":["03402"],"props":[["BIG_TRUCK","Move_Speed","3"],["BULL_DOZER","Move_Speed","4"],["WALL_TRUCK","Move_Speed","4"]]},{"id":"03201","name":"Seismology","cat":10,"eden":1700,"ply":1700,"sci":11,"lab":2,"desc":"Early warning of seismic events now available. _______________________________________ We have developed equipment to detect certain hydrogeochemical early warning signals of seismic events.  Among the most reliable indicators are variations in the concentration of radon and carbon dioxide in the molten salts found in deep bore wells or in fumaroles.  These warnings should give us some time to idle structures in the vicinity of the epicenter, reducing damage to them.","teaser":"Gives early warning of seismic events. _______________________________________ Our previous research on the geology of New Terra indicated that the planet was not subject to seismic activity; recent events, however, have changed the situation.  Our planetary sciences database shows that seismologists had developed methods of seismic event prediction on Earth; some of these techniques may be adaptable to New Terra.","improve":"","req":["03000"],"props":[]},{"id":"04000","name":"Tech Level 4","cat":0,"eden":0,"ply":0,"sci":0,"lab":0,"desc":"","teaser":"","improve":"","req":[],"props":[]},{"id":"05000","name":"Tech Level 5","cat":0,"eden":0,"ply":0,"sci":0,"lab":0,"desc":"","teaser":"","improve":"","req":[],"props":[]},{"id":"05101","name":"Consumerism","cat":9,"eden":1000,"ply":1000,"sci":6,"lab":2,"desc":"Structure Factories may now produce Consumber Goods Factory structure kits.  _______________________________________ Our research into the psychological benefits of consumerism has led to the development of a production facility in which a variety of goods can be produced.  These items can induce a short-term increase in Morale.","teaser":"Allows production of Consumer Goods Factory structure kits at the Structure Factory.  _______________________________________ Though there are a number of goods and services they can purchase, our colonists are asking for something more: items that they can enjoy during their leisure hours.  A few colonists have asked for time at our research facilities to respond to this need.","improve":"","req":["05000"],"props":[]},{"id":"05102","name":"Robot-Assist Mechanic","cat":4,"eden":800,"ply":800,"sci":8,"lab":2,"desc":"Structure Factories may now produce Garage structure kits.  Vehicle Factories may now produce Repair Vehicles.  _______________________________________ Robot-Assist Mechanics, installed at the Garage, are capable of doing most vehicle repairs.  A special version has been mounted on a vehicle for field repairs.","teaser":"Allows production of Garage structure kits at the Structure Factory, and of Repair Vehicles at the Vehicle Factory.  _______________________________________ Our cybernetics experts have proposed a new robot that can be used in repairing vehicles.","improve":"","req":["05000"],"props":[]},{"id":"05104","name":"Lab, Advanced","cat":0,"eden":0,"ply":0,"sci":0,"lab":0,"desc":"","teaser":"","improve":"","req":["05000"],"props":[]},{"id":"03306","name":"Leisure Studies","cat":9,"eden":1200,"ply":1200,"sci":6,"lab":2,"desc":"Structure Factories may now produce Recreation Facility structure kits.  _______________________________________ Our leisure studies project has produced a number of activities, for both individuals and groups, that will amuse, entertain, and stimulate our colonists.  Recreation facility personnel are trained to organize physical exercise classes, games, and tournaments, and to teach various handicrafts.","teaser":"Allows production of Recreation Facility structure kits at the Structure Factory.  _______________________________________ Our colonists are asking for additional entertainment options for their off-duty hours.  This project proposes to tap the humanities database for possible leisure-time activities.","improve":"","req":["05000"],"props":[]},{"id":"05106","name":"Walls, Concrete","cat":0,"eden":0,"ply":0,"sci":0,"lab":0,"desc":"","teaser":"","improve":"","req":["05000"],"props":[]},{"id":"05110","name":"Rare Ore Processing","cat":6,"eden":2500,"ply":2500,"sci":16,"lab":3,"desc":"Structure Factories may now produce Rare Ore Smelter and Rare Metals Storage Tanks structure kits.  Robo-Miners may deploy as Rare Ore Mines.  Robo-Miner production cost increased.  _______________________________________ Rare Metals will be a great asset to us.  These metals can be used in several new research projects.","teaser":"Allows Robo-Miners to deploy as Rare Ore Mines. Allows production of Rare Ore Smelter and Rare Metals Storage Tanks structure kits at the Structure Factory. _______________________________________ Since our arrival on New Terra, we have encountered a number of sites that are rich in rare mineral deposits, but we have had neither applications which called for Rare Metals nor methods of processing these Rare Ores.  Now, our scientists have a number of projects they wish to undertake which would require Rare Metals.","improve":"Can build Rare Ore Mines","req":["03405","05000"],"props":[["MINER","Common_Required","700"]]},{"id":"05111","name":"Independent Turret Power Systems","cat":4,"eden":1700,"ply":1700,"sci":12,"lab":3,"desc":"Laser damage increased. _______________________________________ The R-10 cool-fusion power cell, just developed, is a small but powerful generator designed to fit into the weapons turret on our Lynx combat vehicles.  This replaces the power feeds from the Lynx\u0027 own cool-fusion plant, and makes possible other, more powerful weapons systems.","teaser":"Increases Laser damage. _______________________________________ Our weapons turrets currently feed off the Lynx cool-fusion power plant.  Because of the other demands on this power system, the amount of power that is available to the weapon is limited.  Our research project will develop an independent power source for weapons turrets.","improve":"Increased weapon damage","req":["03402","05000"],"props":[["LASER","Concussion_Damage","45"]]},{"id":"05115","name":"Geothermal Power","cat":3,"eden":2200,"ply":2200,"sci":14,"lab":2,"desc":"Vehicle Factories may now produce Geothermal Constructors (GeoCons).  _______________________________________ Although New Terra does not have ground water, and therefore does not generate underground steam and hot water that produced power on Earth, the fumaroles in this area do contain molten salts and gasses that can be used similarly.  The Geothermal Plant is a less expensive and more stable power generation facility than our current Tokamak plant.","teaser":"Allows production of Geothermal Constructors (GeoCons) at the Vehicle Factory.  _______________________________________ On Earth, a significant percentage of electric power was generated by geothermal power plants.  Although New Terra does not have ground water like Earth, and therefore cannot have the same kind of steam generation that Earth\u0027s geothermal plants had, recent volcanic activity indicates a great deal of underground heat that we may be able to tap into to produce power.","improve":"","req":["03402","05110"],"props":[]},{"id":"05201","name":"Advanced Combat Chassis","cat":4,"eden":2200,"ply":2200,"sci":14,"lab":3,"desc":"Vehicle Factories may now produce Panthers.  _______________________________________ The Panther medium combat chassis, based on the same vehicle body as the ConVec and Cargo Truck, is a heavier, better armored defender than its predecessor, the Lynx.  Although slower than the Lynx, its greater durability in combat should improve our defenses.","teaser":"Allows production of Panthers at the Vehicle Factory.  _______________________________________ While the Lynx has generally been a satisfactory design, it has proven to have a short life expectancy in combat.  Our defenses require a heavier, more durable combat chassis.","improve":"","req":["05110"],"props":[]},{"id":"03202","name":"Vulcanology","cat":10,"eden":1600,"ply":1600,"sci":8,"lab":2,"desc":"Early warning of volcanic eruptions now available. _______________________________________ Using data from our planetary sciences database as well as investigations of volcanoes and magma vents here on New Terra, we have developed an early warning system that will accurately predict volcanic eruptions.  Our dual-method monitoring system uses seismometers to measure rock movement that may indicate rising magma in the planet\u0027s crust and correlation spectrometers that measure sulfur dioxide in plumes rising out of volcanic craters.","teaser":"Gives early warning of volcanic eruptions. _______________________________________ Recent volcanic activity on New Terra threatens our colony.  To protect our colonists, we need to develop a method of predicting eruptions so that we can safely evacuate our colonists.","improve":"","req":["05000"],"props":[]},{"id":"05305","name":"DIRT Procedural Review","cat":11,"eden":1800,"ply":1800,"sci":10,"lab":2,"desc":"DIRT protection capacity increased; DIRT Worker requirement increased. _______________________________________ Using suggestions made by DIRT members, our emergency response procedures have been improved.  Among the improvements are an additional team member, redesigned power-assist armor, and a new type of structural breach patch.","teaser":"Increases DIRT protection capacity. _______________________________________ As our colony grows, more and more resources must be invested in DIRTs to maintain adequate protection.  DIRT members have made several suggestions that may reduce this burden.  A review of methods and procedures is in order.","improve":"Improved protection capacity","req":["03301","05000"],"props":[["DIRT","Production_Capacity","15"],["DIRT","Workers_Required","3"]]},{"id":"05306","name":"Recycler Postprocessing","cat":6,"eden":1500,"ply":1500,"sci":10,"lab":2,"desc":"Metals recovered through recycling increased.  When recycling structure kits or deconstructing structures, the GORF will recover 60% of the original value of the item.  Recycled Ore Rubble increases from 50 units of Ore to 75, and Recycled Rare Ore Rubble increases from 25 to 40 units of Rare Ore.","teaser":"Increases Metals recovered through recycling. _______________________________________ The hot-cracking column used in our GORFs successfully reclaims approximately 50% of the Metals content of materials.  We have some theories about a secondary process that can recover additional metals from the remaining slag.","improve":"Improved Metals reclamation","req":["03302","05000"],"props":[["GORF","Improved","1"]]},{"id":"05307","name":"Automated Diagnostic Examinations","cat":11,"eden":1500,"ply":1500,"sci":8,"lab":2,"desc":"Medical Center capacity improved. _______________________________________ A new type of robotic medical assistant has been developed which can perform many routine tasks at the Medical Center, allowing the staff to care for more patients.","teaser":"Increases Medical Center capacity. _______________________________________ The increase in our population is straining the capacity of our Medical Centers.  We may be able to increase their capacity by automating some tasks.","improve":"Increased Colonist capacity","req":["03303","05000"],"props":[["MED_CENTER","Production_Capacity","75"]]},{"id":"05309","name":"Hypnopaedia","cat":9,"eden":800,"ply":800,"sci":10,"lab":2,"desc":"Scientist training time reduced. _______________________________________  Our hypnopaedia project has borne limited fruits.  Sleep-learning is useful only in reducing the time required for memorization.  This is helpful in that a large part of our research training requires knowledge of what types of research are described in our scientific databases.","teaser":"Reduces Scientist training time. _______________________________________  As our research projects become more complex, we need to improve our methods of training scientists.  Hypnopaedia, or sleep-learning, is a method we plan to investigate.","improve":"Reduced training time","req":["03305","05000"],"props":[["UNIVERSITY","Storage_Capacity","3750"]]},{"id":"05317","name":"Reinforced Vehicle Construction","cat":4,"eden":1200,"ply":1200,"sci":12,"lab":2,"desc":"Cargo Truck, ConVec, and Evacuation Transport Hit Points increased; production costs of these vehicles have changed. _______________________________________  The durability of these vehicles has been improved through a combination of revised construction and the use of a composite alloy incorporating Rare Metals.","teaser":"Increases Hit Points of Cargo Trucks, ConVecs, and Evacuation Transports. _______________________________________  The Cargo Truck, and some similar vehicles, have shown themselves to be all too vulnerable to damage from disasters, explosions, and attacks.  Through the use of new composite alloys incorporating Rare Metals, we can increase their durability.","improve":"Increased Hit Points","req":["05110"],"props":[["CON_TRUCK","Hit_Points","375"],["CON_TRUCK","Common_Required","1000"],["CON_TRUCK","Rare_Required","150"],["BIG_TRUCK","Hit_Points","750"],["BIG_TRUCK","Common_Required","500"],["BIG_TRUCK","Rare_Required","100"],["MOBILE_HOME","Hit_Points","280"],["MOBILE_HOME","Common_Required","650"],["MOBILE_HOME","Rare_Required","100"]]},{"id":"05318","name":"Robotic Image Processing","cat":4,"eden":1400,"ply":1400,"sci":12,"lab":2,"desc":"Light Tower, Guard Post, and Scout sight ranges improved. _______________________________________ Through a combination of improved image processing software and increased zoom telescoping vision systems, the visual recognition range of certain units has been improved.","teaser":"Improves Light Tower, Guard Post, and Scout sight ranges. _______________________________________ The visual recognition systems of our robotic vehicles have a limited useful range, partially due to the limitations of the image processing software.  Some of our programmers have a possible solution.","improve":"Improved sight range","req":["05000"],"props":[["TOWER_LIGHT","Sight_Range","9"],["TOWER_GUARD","Sight_Range","9"],["SCOUT","Sight_Range","8"]]},{"id":"05401","name":"Repair vehicle","cat":0,"eden":0,"ply":0,"sci":0,"lab":0,"desc":"","teaser":"","improve":"","req":["05102"],"props":[]},{"id":"05405","name":"Space Program","cat":8,"eden":4000,"ply":4000,"sci":18,"lab":3,"desc":"Structure Factories may now produce Spaceport structure kits.  Spaceports may produce Single Use Launch Vehicle (SULV) and EDWARD satellite.  _______________________________________ Our space program is underway.  As an initial cargo, we have developed the Early Disaster Warning and Resource Detection (EDWARD) satellite.","teaser":"Allows production of Spaceport structure kits at the Structure Factory. _______________________________________ With the discovery that the Blight cannot be stopped, and that New Terra will eventually become uninhabitable, it becomes imperative that we develop a space launch facility as the first step in our evacuation of New Terra.","improve":"","req":["05110"],"props":[]},{"id":"05501","name":"Smelter, Rare Ore construction","cat":0,"eden":0,"ply":0,"sci":0,"lab":0,"desc":"","teaser":"","improve":"","req":["05110"],"props":[]},{"id":"05502","name":"Storage Tanks, Rare Metals","cat":0,"eden":0,"ply":0,"sci":0,"lab":0,"desc":"","teaser":"","improve":"","req":["05110"],"props":[]},{"id":"05503","name":"SULV (Eden)","cat":0,"eden":0,"ply":0,"sci":0,"lab":0,"desc":"","teaser":"","improve":"","req":["05405"],"props":[]},{"id":"05504","name":"EDWARD satellite","cat":0,"eden":0,"ply":0,"sci":0,"lab":0,"desc":"","teaser":"","improve":"","req":["05405"],"props":[]},{"id":"05506","name":"Directional Magnetic Fields","cat":7,"eden":2000,"ply":2000,"sci":14,"lab":3,"desc":"The Rail Gun weapon is now available.  _______________________________________ The Rail Gun turret uses an electric current to accelerate a projectile to velocities of several hundred meters per second. The weapon consists of two copper rails and the R-10 cool-fusion power cell, which charges a capacitor.  The capacitor is discharged into one rail and the current flows through the projectile into the second rail, producing a directional magnetic field that accelerates the projectile.","teaser":"Makes the Rail Gun weapon available. _______________________________________ Some of our researchers, reviewing the military database brought from Earth, have found an abstract of a proposal for a weapon that uses a directional magnetic field to propel a projectile.  Although plans for the weapon were lost, we believe we can recreate such a device.","improve":"","req":["05111","05201"],"props":[]},{"id":"06000","name":"06000 Tech Level 6","cat":0,"eden":0,"ply":0,"sci":0,"lab":0,"desc":"","teaser":"","improve":"","req":[],"props":[]},{"id":"07000","name":"07000 Tech Level 7","cat":0,"eden":0,"ply":0,"sci":0,"lab":0,"desc":"","teaser":"","improve":"","req":[],"props":[]},{"id":"08000","name":"08000 Tech Level 8","cat":0,"eden":0,"ply":0,"sci":0,"lab":0,"desc":"","teaser":"","improve":"","req":[],"props":[]},{"id":"05302","name":"Meteorology","cat":10,"eden":1600,"ply":1600,"sci":10,"lab":2,"desc":"Early warning of electrical storms now available. _______________________________________ We now understand the atmospheric conditions that lead to filimentous, or arc, lightning discharges in the New Terran atmosphere, and can predict their occurrence.  On Earth, collisions between water particles of varying sizes caused the build-up of an electrical charge in the atmosphere.  Negatively-charged particles in storm clouds were attracted to the positively-charged ground.  The process is similar on New Terra, except that instead of water particles colliding, we have dust particles colliding.","teaser":"Gives early warning of electrical storms. _______________________________________ Although there have always been electrical discharges in the New Terran atmosphere, the atmosphere\u0027s low pressure caused these discharges to be manifested as sudden glows, rather than lightning strikes as on Earth.  Now, with the thickening of the atmosphere, dangerous lightning is becoming more of a danger.  We need to study these strikes so that we can predict their occurrence and take precautions.","improve":"","req":["08000"],"props":[]},{"id":"05303","name":"Severe Atmospheric Disturbances","cat":10,"eden":1600,"ply":1600,"sci":10,"lab":2,"desc":"Early warning of vortexes now available. _______________________________________ The vortexes start in a manner similar to the \u0027dust-devils\u0027 common on Earth and Mars.  Ground-level air, heated by sunlight, rises.  Cooler air rushes into the area that the warmer air has left, but from there, the spinning column of air is enhanced and focused by a yet-unknown process which may be electromagnetic in nature.  While our understanding is limited, we can now forecast conditions that will lead to their formation, and have developed technologies for early detection.","teaser":"Gives early warning of vortexes. _______________________________________ The vortexes we have been experiencing are a new phenomenon on New Terra; we must study these severe storms to determine how they are caused and how to predict them.","improve":"","req":["05302"],"props":[]},{"id":"05508","name":"Electromagnetic Pulsing","cat":7,"eden":1600,"ply":1600,"sci":10,"lab":3,"desc":"The EMP weapon is now available.  _______________________________________ Electromagnetic pulse (EMP) grenades, fired from Guard Posts or combat chassis, produce a disruption in the power distribution circuitry of all vehicles or structures in range.  This will briefly render the target inoperable.","teaser":"Makes the EMP weapon available.  _______________________________________ Since the early development of atomic weaponry, scientists have known about the disruptive effect of the electromagnetic pulse (EMP) on electronic circuitry.  Our scientists believe they can use this knowledge to produce a defensive weapons system.","improve":"","req":["08000"],"props":[]},{"id":"07102","name":"Explosive Charges","cat":7,"eden":325,"ply":325,"sci":4,"lab":2,"desc":"The Starflare weapon is now available.  _______________________________________ The Starflare turret is a large trinitrotoluene (TNT) bomb, which may be placed on the Lynx or Panther combat chassis, or installed into a Guard Post.  This high-explosive will damage all units within range.","teaser":"Makes the Starflare weapon available.  _______________________________________ A simple and inexpensive weapons system could be developed by placing high explosive charges into a weapons turret.  Although the vehicle would be destroyed by the detonation, the size of the charge could quickly incapacitate several enemy units at once.","improve":"","req":["08000"],"props":[]},{"id":"07201","name":"Rare Ore Extraction","cat":6,"eden":4000,"ply":4000,"sci":18,"lab":3,"desc":"Rare Ore Mine yield increased.  _______________________________________ Our project has met with limited success.  We have developed two new processes that determine the Rare Metal content of certain gangue materials, such as quartz, and eliminate specimens containing only trace amounts of Metal.","teaser":"Increases Rare Ore Mine yield.  _______________________________________ Our Rare Ore mining facilities have had only moderate success at finding the best methods of extracting higher grades of Rare Ore.  Several proposals have been put forward to improve our efficiency.","improve":"Improved Rare Ore yield","req":["08000"],"props":[["MINE_ADV","Improved","1"]]},{"id":"07202","name":"Hot-Cracking Column Efficiency","cat":6,"eden":1400,"ply":1400,"sci":14,"lab":2,"desc":"Common Ore Smelter, Rare Ore Smelter, and GORF Power requirement reduced.","teaser":"Reduces Common Ore Smelter, Rare Ore Smelter, and GORF Power requirements. _______________________________________ Smelters and GORFs are dependent on hot cracking columns to separate the Metal content of Ores or rubble.  This equipment has a very high Power demand.  We believe that we may be able to apply our high-temperature superconductive material to some elements of this system and reduce the Power demand.","improve":"Reduced Power demand","req":["08000"],"props":[["SMELTER_ADV","Power_Required","40"],["SMELTER","Power_Required","40"],["GORF","Power_Required","40"]]},{"id":"07203","name":"Smelter Postprocessing","cat":6,"eden":4000,"ply":4000,"sci":18,"lab":3,"desc":"Common Ore Smelter and Rare Ore Smelter production increased.  _______________________________________ We have successfully adapted the chemical postprocessing treatment used at the GORF to improve the yield of our Smelters.","teaser":"Increases Common Ore Smelter and Rare Ore Smelter production.  _______________________________________ The chemical postprocessing technique we developed for improving metals reclamation at the GORF may be adaptable for use at our Common Ore and Rare Ore Smelters.","improve":"Increased ore yield","req":["05306","08000"],"props":[["SMELTER","Improved","1"],["SMELTER_ADV","Improved","1"]]},{"id":"07206","name":"Scout-class Drive Train Refit","cat":4,"eden":1500,"ply":1500,"sci":12,"lab":2,"desc":"Scout, Robo-Surveyor, and Lynx speeds improved. _______________________________________ The G-75 drive train used in these three vehicles has been replaced by the G-80 model, which improved vehicle speed through a more efficient transfer of energy from the power plant to the wheels.","teaser":"Increases Scout, Robo-Surveyor, and Lynx speeds. _______________________________________ The Scout, and some similar vehicles, use the G-75 drive train.  We have discovered a design flaw in the G-75 that impairs its efficiency.  This project would redesign the G-75 to make it more effective.","improve":"Increased speed","req":["08000"],"props":[["LIGHT_TANK","Move_Speed","2"],["SURVEYOR","Move_Speed","3"],["SCOUT","Move_Speed","1"]]},{"id":"07213","name":"Advanced Robotic Manipulator Arm","cat":4,"eden":2800,"ply":2800,"sci":16,"lab":2,"desc":"ConVec, Earthworker, Robo-Dozer, Repair Vehicle, and Garage productivity improved.  _______________________________________  Several small refinements to the manipulator arms of these units, such as reconfigured joints, use of higher tensile strength metals in construction, and a software upgrade, add up to a substantial improvement in the production and repair rates of these units.","teaser":"Improves ConVec, Earthworker, Robo-Dozer, Repair Vehicle, and Garage productivity.  _______________________________________  Certain units, such as the ConVec, use manipulator arms to accomplish complex tasks.  Our cybernetic experts have a proposal for improving the flexibility and strength of these manipulator arms.","improve":"Improved productivity","req":["05401","08000"],"props":[["REPAIR_TRUCK","Production_Rate","96"],["CON_TRUCK","Production_Rate","96"],["WALL_TRUCK","Production_Rate","96"],["GARAGE","Production_Capacity","96"],["BULL_DOZER","Production_Rate","96"]]},{"id":"07403","name":"Increased Capacitance Circuitry","cat":7,"eden":1800,"ply":1800,"sci":10,"lab":3,"desc":"Rail Gun damage increased. _______________________________________  The new design of the dielectric insulator has increased the capacitance of the capacitors used in the Rail Gun weapon systems.  The higher discharge increases the acceleration of the projectile by 20%.  In addition, our researchers are brainstorming another possible use for this technology, and will soon submit a new project proposal.","teaser":"Increases Rail Gun damage. _______________________________________  As our experience in using Rare Metals grows, we find new applications for these materials.  Our boptronics engineers believe they can refine the design of the dielectric insulators used in some of our high-voltage capacitors to improve their efficiency.","improve":"Increased weapon damage","req":["08000"],"props":[["RAIL_GUN","Concussion_Damage","100"],["RAIL_GUN","Penetration_Damage","50"]]},{"id":"08051","name":"Meteor-Watch Observatory","cat":8,"eden":1800,"ply":1800,"sci":12,"lab":2,"desc":"Structure Factories may now produce Observatory structure kits. _______________________________________ Deployment of the Observatory structure will allow us at least a minimal amount of warning of meteorite impacts in the area of our colony.  The Observatory incorporates a wide-field optical telescope with a sophisticated tracking system to allow us to project the path of incoming meteors.","teaser":"Allows production of Observatory structure kits at the Structure Factory. _______________________________________ After the recent meteorite impacts, our observations have found that more are to come.  New Terra is entering a field of debris, probably caused by the collision of two asteroids.  We need a way to track this debris so we can have some advance warning of meteorite impacts.","improve":"","req":["08000"],"props":[]},{"id":"08103","name":"Magma Refining","cat":6,"eden":3200,"ply":3200,"sci":16,"lab":3,"desc":"Robo-Miners may now deploy as Magma Wells.  Robo-Miner production cost increased.  _______________________________________ Using the same basic configuration as our Mines, we have created a process of extracting and cooling magma from magma vents.  The product of this process is a steady supply of Rare Ores, with a constant yield of 100 units of Rare Metals.","teaser":"Allows Robo-Miners to deploy as Magma Wells. _______________________________________ Initial observations of the magma vents that have begun to appear on the New Terran surface indicate that the magma is rich in Rare Metals.  If we could develop a method of safely using this magma, it would greatly increase our supply of this resource.","improve":"Can build Magma Wells","req":["08000"],"props":[["MINER","Common_Required","800"]]},{"id":"08104","name":"Expanded Housing","cat":9,"eden":1600,"ply":1600,"sci":10,"lab":2,"desc":"Structure Factories may now produce Advanced Residence structure kits. _______________________________________ The new Advanced Residence structure provides our colonists with larger, more spacious quarters, yet reduces administrative and maintenance difficulties and has only a slightly higher cost.","teaser":"Allows production of Advanced Residence structure kits at the Structure Factory. _______________________________________ As our population has grown, so has the number of Residence structures we need to house our people, making the colony more difficult to manage.  A larger Residence facility, serving more colonists, would reduce some of our administrative problems.","improve":"","req":["03406","08000"],"props":[]},{"id":"08106","name":"High-Energy Ray-Composite Projector","cat":10,"eden":4000,"ply":4000,"sci":18,"lab":2,"desc":"Structure Factories may now produce Meteor Defense structure kits. _______________________________________ The High-Energy Ray-Composite (HERC) Projector is now functional.  Although the equipment needed to produce this energy/particle beam is far too massive for use in a weapons turret, it is ideal for use as a meteor defense.  Using the tracking capabilities of the Observatory, the HERC beam can destroy even the largest meteors with a single shot---if it hits its target.","teaser":"Allows production of Meteor Defense structure kits at the Structure Factory. _______________________________________ Some very ambitious high-energy physicists have submitted a proposal for an energy weapon.  Their theory combines both microwave and laser projection with a particle beam projector.","improve":"","req":["08051"],"props":[]},{"id":"08201","name":"Dual-Turret Weapons Systems","cat":4,"eden":4000,"ply":4000,"sci":18,"lab":3,"desc":"Vehicle Factories may now produce Tigers.  _______________________________________ The dual-turret weapons systems are capable of twice the effective rate-of-fire of their single-turret predecessors, but duplicate only 70% of the components, sharing certain support systems.  Due to their size, they can only be mounted on the Tiger heavy combat chassis, a tracked vehicle based on the Earthworker and Robo-Dozer designs.","teaser":"Allows production of Tigers at the Vehicle Factory.  _______________________________________ One of our research Scientists has proposed doubling the rate of fire of our combat units by installing a dual weapons turret.  This may be just the decisive advantage we need to end this destructive conflict.","improve":"","req":["05317","08000"],"props":[]},{"id":"08301","name":"Efficiency Engineering","cat":2,"eden":4000,"ply":4000,"sci":16,"lab":2,"desc":"Production time at all factories reduced. _______________________________________ Using time-and-motion analysis of the various production facilities, our researchers developed several new tools and techniques that reduced the production time of all products.","teaser":"Reduces production time at all factories. _______________________________________ All of our factories use a similar assembly-line method of production.  Some of our factory workers, reading through the databases of industrial engineering techniques from Earth, have proposed a study of our factories, to look for possible increases in manufacturing efficiency.","improve":"Improved production rate","req":["05101","08000"],"props":[["FACT_LUXURY","Production_Capacity","96"],["FACT_STRUCTURE","Production_Capacity","96"],["FACT_VEHICLE","Production_Capacity","96"],["SPACEPORT","Production_Capacity","96"]]},{"id":"08304","name":"Heat Mining","cat":3,"eden":1600,"ply":1600,"sci":10,"lab":2,"desc":"Geothermal Plant Power output increased.  _______________________________________ Our Heat Mining project has met with limited success.  We have not been able to develop a viable geothermal plant that can be deployed away from fumaroles, but by injecting cold water into the fumarole, we have been able to increase the output of our Geothermal plants.","teaser":"Increases Geothermal Plant Power output.  _______________________________________ Our Geothermal Plants rely on the molten salts and gasses found in fumaroles to generate power.  Heat Mining, or Hot Dry Rock geothermal power generation, may allow us to place Geothermal Plants in places without fumaroles by injecting cold water into deep bore wells, then capturing the steam produced when the water reaches the hot rocks in the New Terran surface.","improve":"Increased Power output","req":["05115","08000"],"props":[["GEOTHERMAL","Production_Capacity","650"]]},{"id":"08306","name":"Enhanced Defensive Fortifications","cat":2,"eden":1600,"ply":1600,"sci":12,"lab":2,"desc":"Guard Posts armor upgraded.  _______________________________________  The armor applied to our Guard Posts is now equal to that protecting our most vital structures.","teaser":"Upgrades Guard Posts armor.  _______________________________________  With tensions increasing between the two colonies, we must make our defenses as strong as possible, especially as we begin development of our starship.","improve":"Improved armor","req":["08000"],"props":[["TOWER_GUARD","Armor","5"]]},{"id":"08307","name":"Multitainment Console Upgrade","cat":9,"eden":1200,"ply":1200,"sci":8,"lab":2,"desc":"Recreation Facility capacity increased. _______________________________________  Our improved Multitainment Consoles are smaller and less expensive, while maintaining their high performance level.  The number of units included in the Recreation Facility design has been increased, allowing the facility to serve more colonists.","teaser":"Increases Recreation Facility capacity. _______________________________________  The demands on our Recreation Facilities have grown even as our colony has grown.  This project hopes to ease the situation by improving the multitainment consoles so many of our Colonists use during their off-duty hours.","improve":"Increased Colonist capacity","req":["03306","08000"],"props":[["RECREATION","Production_Capacity","60"]]},{"id":"08309","name":"Reinforced Panther Construction","cat":4,"eden":1600,"ply":1600,"sci":12,"lab":3,"desc":"Panther Hit Points increased; Panther production costs changed.  _______________________________________  A redesign of the Panther using a new composite alloy has increased the durability of this combat chassis.","teaser":"Increases Panther Hit Points. _______________________________________  The composite alloy developed in our Reinforced Vehicle Construction project may be beneficial for our Panther combat chassis as well.","improve":"Increased hit points","req":["05317","08000"],"props":[["MED_TANK","Hit_Points","700"],["MED_TANK","Common_Required","300"],["MED_TANK","Rare_Required","150"]]},{"id":"08317","name":"Meteor detection","cat":0,"eden":0,"ply":0,"sci":0,"lab":0,"desc":"","teaser":"","improve":"","req":["08051"],"props":[]},{"id":"08401","name":"Blight-Resistant Isotopes","cat":2,"eden":2000,"ply":2000,"sci":14,"lab":3,"desc":"Earthworkers may now deploy Microbe Walls. _______________________________________  We have isolated the particular isotope that affects the Blight.  Unfortunately, the isotope has a short half-life, and is difficult to produce in large quantities.  However, we have modified the Earthworker to build temporary barriers against the Blight.  These barriers will not permanently destroy the microbe, but may buy us extra time for evacuations.","teaser":"Allows Earthworkers to deploy Microbe Walls. _______________________________________  During a recent evacuation, a minor accident at a Tokamak revealed a potential method of dealing with the Blight.  Destabilized by an earthquake, the Tokamak exploded and released an unusual waste product--an isotope that seemed to retard the growth of the Blight!","improve":"","req":["03303","08000"],"props":[]},{"id":"08503","name":"Acid Weaponry","cat":7,"eden":3500,"ply":3500,"sci":16,"lab":3,"desc":"The Acid Cloud weapon is now available.  _______________________________________ Our Acid Cloud turrets fire a projectile which releases a cloud of corrosive acid that can eat through even the toughest armor.  The cloud dissolves after a brief period, but any target caught within the cloud will take heavy damage.","teaser":"Makes the Acid Cloud weapon available.  _______________________________________ Our Common Ore Smelters produce a number of toxic byproducts during the processing of Common Ore into Common Metals.  We believe we can use these wastes in a new weapons system.","improve":"","req":["08103"],"props":[]},{"id":"08601","name":"Skydock","cat":8,"eden":3500,"ply":3500,"sci":18,"lab":3,"desc":"Spaceports may now produce the Skydock. _______________________________________ Our Skydock will function as an orbital command post.  In addition to docking facilities for our launch vehicles ferrying components and technicians, it serves as a command and control facility for construction of our evacuation starship.","teaser":"Allows production of the Skydock at the Spaceport. _______________________________________ We must begin construction of an evacuation starship as soon as possible.  The first step is an orbital station from which we can start deploying components of the ship.","improve":"","req":["08000"],"props":[]},{"id":"08801","name":"Ion Drive Module","cat":12,"eden":3500,"ply":3500,"sci":18,"lab":3,"desc":"Spaceports may now produce the Ion Drive Module. _______________________________________ The ion motor used in the \u0027Conestoga\u0027 was a low-thrust/long-duration system activated once the ship reached interstellar space.  The Ion Drive Module contains this interstellar drive as well as supplemental ion and chemical guidance thrusters to be attached to the starship.","teaser":"Allows production of the Ion Drive Module at the Spaceport. _______________________________________ While the main drive of the \u0027Conestoga\u0027 was a less capable fusion drive, it appears that an improved ion propulsion system was developed shortly before launch and used in some thruster systems.  The remains of one of these thrusters has been recovered from the \u0027Conestoga\u0027 crash site.  Reverse-engineering this thruster will be a substantial step in developing our evacuation starship.","improve":"","req":["08601"],"props":[]},{"id":"08901","name":"Fusion Drive Module","cat":12,"eden":3500,"ply":3500,"sci":18,"lab":3,"desc":"Spaceports may now produce the Fusion Drive Module. _______________________________________ Our fusion propulsion system plans are complete.  The Fusion Drive Module contains both the fusion motor, used for high-acceleration in-system maneuvering, and the tanks which store the hydrogen fuel used in this motor.  Once we have reached interstellar space, this fusion motor will convert into a fusion reactor that will provide power to the Ion Drive.","teaser":"Allows production of the Fusion Drive Module at the Spaceport. _______________________________________ Some of the wreckage recovered from the starship crash site appears to be part of a fusion motor propulsion system.  Further examination of the wreckage will allow us to re-build such a system.","improve":"","req":["08801"],"props":[]},{"id":"08951","name":"Fueling Systems","cat":12,"eden":3500,"ply":3500,"sci":18,"lab":3,"desc":"Spaceports may now produce the Fueling Systems. _______________________________________ The Fueling Systems consist of storage tanks for liquid mercury, used to fuel the Ion Drive, and the Fuel Shark, an autonomous ramscoop vehicle that dives into the outer layers of the planet\u0027s atmosphere to gather hydrogen fuel for the Fusion Drive.  The Fuel Shark will substantially reduce the number of launches necessary to prepare the starship for flight.","teaser":"Allows production of the Fueling Systems at the Spaceport. _______________________________________ Portions of a severely-damaged spacecraft were among the wreckage found at the \u0027Conestoga\u0027 crash site.  The ship was known to have carried an emergency refueling unit, designed to scoop hydrogen from the atmosphere of gas giants similar to Jupiter.  Should New Terra have been found to be uninhabitable, this \u0027Fuel Shark\u0027 would have been able to refuel the \u0027Conestoga\u0027 for travel to another star.","improve":"","req":["08801"],"props":[]},{"id":"09000","name":"09000 Tech Level 9","cat":0,"eden":0,"ply":0,"sci":0,"lab":0,"desc":"","teaser":"","improve":"","req":[],"props":[]},{"id":"10000","name":"10000 Tech Level 10","cat":0,"eden":0,"ply":0,"sci":0,"lab":0,"desc":"","teaser":"","improve":"","req":[],"props":[]},{"id":"07212","name":"Extended-Range Projectile Launcher","cat":7,"eden":4000,"ply":4000,"sci":18,"lab":3,"desc":"EMP and Acid Cloud ranges increased. _______________________________________  The redesigned launch mechanism used in both of these weapons has lengthened the maximum range of these weapons.","teaser":"Increases EMP and Acid Cloud ranges. _______________________________________  Our after-action equipment performance reports show a weakness in the launch mechanism used in our EMP and Acid Cloud weapons turrets.  Though this weakness does not cause an equipment failure, our engineers would like to revisit the design of this launcher.","improve":"","req":["05508","08503","10000"],"props":[["ACID","Sight_Range","7"],["EMP","Sight_Range","7"]]},{"id":"10101","name":"Improved Launch Vehicle","cat":8,"eden":6000,"ply":6000,"sci":18,"lab":3,"desc":"Spaceports may now produce the Reusable Launch Vehicle (RLV). _______________________________________  Though the RLV is much more costly than a single SULV, on a per-launch basis, the RLV is significantly less expensive.","teaser":"Allows production of the Reusable Launch Vehicle (RLV) at the Spaceport. _______________________________________  Our SULVs are proving quite expensive on a per launch basis.  Our aeronautical experts have proposed a new launch vehicle to address this issue.","improve":"","req":["10000"],"props":[]},{"id":"10102","name":"Artificial Lightning","cat":7,"eden":4000,"ply":4000,"sci":18,"lab":3,"desc":"The Thor\u0027s Hammer weapon is now available. _______________________________________  Our artificial lightning weapon, dubbed Thor\u0027s Hammer, is the most powerful weapon we have ever developed.  This targeted lightning strike is capable of destroying small enemy units with a single shot!","teaser":"Makes the Thor\u0027s Hammer weapon available. _______________________________________  A new weapons system proposal has been submitted by our research staff.  Using the dielectric insulator produced by our Increased Capacitance Circuitry project, a rapid discharge of a bank of capacitors could create an artificial lightning strike of massive power.  The difficulty is in targeting the strike to strike enemy units, rather than a random discharge.","improve":"","req":["07403","10000"],"props":[]},{"id":"10202","name":"Command Module","cat":12,"eden":3500,"ply":3500,"sci":18,"lab":3,"desc":"Spaceports may now produce the Command Module. _______________________________________ Several dozen Savant computer systems, working in parallel, make up the core of the Command Module.  This is the most sophisticated computer system we have ever devised, capable of guidance control, power direction, and self-maintenance, without human intervention, for decades.","teaser":"Allows production of the Command Module at the Spaceport. _______________________________________ Wreckage from the second \u0027Conestoga\u0027 crash site included a remarkably intact section of the ship\u0027s command deck.  This will speed our development of the command and control systems of the ship.","improve":"","req":["10000"],"props":[]},{"id":"10204","name":"Solar Power","cat":3,"eden":3200,"ply":3200,"sci":18,"lab":3,"desc":"Structure Factories may now produce Solar Power Array structure kits; Spaceports may now produce Solar Power Satellites. _______________________________________  The solar power system, comprised of a collector satellite and ground-based receiver, is an inexpensive alternative energy source.  The satellite, once in orbit, can be retargeted at a new ground location after an evacuation, and the receivers are much less volatile than our Tokamak fusion reactors.","teaser":"Allows production of the Solar Power systems. _______________________________________  The technology behind solar power has been available for quite some time, the size of the solar collector panels needed to generate a significant amount of power has always been judged prohibitive, especially since our periodic evacuations began.  However, with the redevelopment of a space program, it is possible to build a solar collector satellite which beams the energy it collects to a ground-based receiver.","improve":"","req":["10000"],"props":[]},{"id":"10205","name":"Habitat Ring","cat":12,"eden":3500,"ply":3500,"sci":18,"lab":3,"desc":"Spaceports may now produce the Habitat Ring. _______________________________________ Before and after our interstellar flight, our colonists will live in the Habitat Ring.  These temporary quarters are shielded from radiation and small particle collisions by a magnetic field generated by superconductive coils built into the hull.","teaser":"Allows production of the Habitat Ring at the Spaceport. _______________________________________ Two of the recovered fragments of the \u0027Conestoga\u0027 are from the hull of the habitat ring.  They contain large superconductive magnetic coils, which appear to be a kind of radiation shielding system.","improve":"","req":["10000"],"props":[]},{"id":"10206","name":"Sensor Package","cat":12,"eden":3500,"ply":3500,"sci":18,"lab":3,"desc":"Spaceports may now produce the Sensor Package. _______________________________________  Before we can depart the New Terra system, we must have a destination.  Our Sensor Package includes a Nanoprobe launcher, capable of sending thousands of microbe-sized probes toward potentially habitable planets, and a sensor/telemetry system which will evaluate the reports sent back by the Nanoprobes.","teaser":"Allows production of the Sensor Package at the Spaceport. _______________________________________  A portion of the \u0027Conestoga\u0027s sensor suite was among the debris retrieved from the second crash site.  This appears to have been part of the telemetry system used to monitor the deep-space probes sent out to locate a suitable destination.  We believe we can use this as the basis for a similar system.","improve":"","req":["10000"],"props":[]},{"id":"10208","name":"Stasis Systems","cat":12,"eden":3500,"ply":3500,"sci":18,"lab":3,"desc":"Spaceports may now produce the Stasis Systems. _______________________________________ The Stasis Systems contain suspended animation chambers for 200 colonists.  This module, like the Habitat Ring, is equipped with our superconductive magnetic coil radiation shield system.","teaser":"Allows production of the Stasis Systems at the Spaceport. _______________________________________ The cold-sleep system used in the \u0027Conestoga\u0027 successfully slowed the metabolic rate of the colonists traveling from Earth to New Terra, but at the cost of shortening their lives once they had arrived.  Fortunately, our medical technology has advanced significantly since our arrival, and we believe we now have a method of inducing true suspended animation without the same loss of longevity.","improve":"","req":["03303","10205"],"props":[]},{"id":"10209","name":"Orbital Package","cat":12,"eden":3500,"ply":3500,"sci":18,"lab":3,"desc":"Spaceports may now produce the Orbital Package. _______________________________________ This group of satellites and probes, to be deployed upon reaching our destination planet, includes EDWARD, a communications satellite, a solar power satellite, orbital observers, and several types of atmospheric and geologic probes.","teaser":"Allows production of the Orbital Package at the Spaceport. _______________________________________ Upon arrival at our new home, we want to deploy a series of satellites and probes that will provide data about the planet and support colony operations.","improve":"","req":["10000"],"props":[]},{"id":"10301","name":"Magma Purity Control","cat":6,"eden":4500,"ply":4500,"sci":18,"lab":3,"desc":"Magma Well yield increased. _______________________________________  Our Magma Purity Control technique removes several waste materials from the magma before cooling it for transport to the Rare Ore Smelter.","teaser":"Increases Magma Well yield. _______________________________________  Although magma contains all of the elements we classify as Rare Metals, it also contains several other elements which are essentially waste materials.  We may be able filter out some of these additional materials in our molten magma flow.","improve":"Improved Rare Ore yield","req":["08103","10000"],"props":[["MAGMA_WELL","Production_Capacity","150"]]},{"id":"10303","name":"Advanced Armoring Systems","cat":4,"eden":3200,"ply":3200,"sci":18,"lab":3,"desc":"Lynx and Panther armor upgraded. _______________________________________  Materials research done as part of our space program has resulted in an alloy well suited for use in combat vehicle armor.","teaser":"Upgrades Lynx and Panther armor. _______________________________________  The technologies developed by our space program have some spinoff applications on New Terra.  One of these is an improvement to the armor systems we use on some of our vehicles.","improve":"Increased armor","req":["10000"],"props":[["LIGHT_TANK","Armor","2"],["MED_TANK","Armor","3"]]},{"id":"10306","name":"Grenade Loading Mechanism","cat":7,"eden":3600,"ply":3600,"sci":18,"lab":3,"desc":"Improves EMP and Acid Cloud rate of fire. _______________________________________  The hydraulic grenade loading mechanism used in some of our weapons turrets had been designed to handle ammunition that was much less shock-resistant that those we currently have in use.  Increasing the \u0027rattle\u0027 tolerances of the system allows for a faster loading system.","teaser":"Improves EMP and Acid Cloud rate of fire. _______________________________________  Tests of the reloading mechanism in our grenade launching weapons, the EMP and Corrosive Acid have revealed some potential areas of improvement.","improve":"Improved rate of fire","req":["07212"],"props":[["EMP","Rate_Of_Fire","120"],["ACID","Rate_Of_Fire","120"]]},{"id":"11000","name":"Tech Level 11","cat":0,"eden":0,"ply":0,"sci":0,"lab":0,"desc":"","teaser":"","improve":"","req":[],"props":[]},{"id":"12000","name":"Tech Level 12","cat":0,"eden":0,"ply":0,"sci":0,"lab":0,"desc":"","teaser":"","improve":"","req":[],"props":[]},{"id":"10309","name":"Precision Trajectory Projection Software","cat":10,"eden":2400,"ply":2400,"sci":14,"lab":2,"desc":"Observatory\u0027s meteor targeting system improved. _______________________________________  Revision of the meteor tracking software, using algorithms developed as part of the space program, has improved the trajectory projection software used at the Observatory.  This will increase the probability of destroying incoming meteors before they reach our colony.","teaser":"Improves Observatory\u0027s meteor targeting system. _______________________________________  Our Meteor Defense is effective... when it can find the target.  Field tests of the system show a significant possibility of inaccurate targeting coordinates generated by the Observatory tracking software.","improve":"Improved meteor tracking","req":["08106","12000"],"props":[["OBSERVATORY","Improved","1"]]},{"id":"10401","name":"Phoenix Module","cat":12,"eden":3500,"ply":3500,"sci":18,"lab":3,"desc":"Spaceports may now produce the Phoenix Module. _______________________________________  When deployed, this self-contained lander transforms into several of the initial structures and vehicles needed to start a colony.  These structures are all capable of operation without human presence, and will give our new home a head start.","teaser":"Allows production of the Phoenix Module at the Spaceport. _______________________________________  Before we land our colonists on the new planet, we must send a lander to prepare the early stages of a colony.  We have in our databases portions of the plans for the Seed Factory used on our arrival on New Terra, but they are incomplete and obsolescent.","improve":"","req":["12000"],"props":[]},{"id":"12101","name":"Heat Dissipation Systems","cat":7,"eden":3600,"ply":3600,"sci":18,"lab":3,"desc":"Laser, Rail Gun, and Thor\u0027s Hammer rate of fire increased. _______________________________________  Our new weapons turret heat sinks allow these weapons to be fired more quickly.  The heat sinks use dichlorodifluoromethane gas as a coolant to prevent weapon overheating.","teaser":"Increases Laser, Rail Gun, and Thor\u0027s Hammer rate of fire. _______________________________________  Some of our weapons systems generate high levels of heat when repeatedly fired in combat.  These weapons require a cooling-off period before they can be fired again.  This delay could be shortened by adding a heat dissipation system.","improve":"Increased rate of fire","req":["10102","12000"],"props":[["LASER","Rate_Of_Fire","22"],["RAIL_GUN","Rate_Of_Fire","65"],["THORS_HAMMER","Rate_Of_Fire","100"]]},{"id":"12499","name":"Children\u0027s Module","cat":0,"eden":3,"ply":3,"sci":1,"lab":1,"desc":"This space intentionally left blank.","teaser":"This space intentionally left blank.","improve":"","req":["12000"],"props":[]},{"id":"12599","name":"Evacuation Module","cat":0,"eden":3,"ply":3,"sci":1,"lab":1,"desc":"This space intentionally left blank.","teaser":"This space intentionally left blank.","improve":"","req":["12000"],"props":[]},{"id":"02099","name":"NOT AVAILABLE","cat":0,"eden":-1,"ply":-1,"sci":0,"lab":0,"desc":"","teaser":"","improve":"","req":[],"props":[]},{"id":"02115","name":"NOT AVAILABLE","cat":0,"eden":-1,"ply":-1,"sci":0,"lab":0,"desc":"","teaser":"","improve":"","req":[],"props":[]},{"id":"03603","name":"NOT AVAILABLE","cat":0,"eden":-1,"ply":-1,"sci":0,"lab":0,"desc":"","teaser":"","improve":"","req":[],"props":[]},{"id":"05107","name":"NOT AVAILABLE","cat":0,"eden":-1,"ply":-1,"sci":0,"lab":0,"desc":"","teaser":"","improve":"","req":[],"props":[]},{"id":"05108","name":"NOT AVAILABLE","cat":0,"eden":-1,"ply":-1,"sci":0,"lab":0,"desc":"","teaser":"","improve":"","req":[],"props":[]},{"id":"05116","name":"NOT AVAILABLE","cat":0,"eden":-1,"ply":-1,"sci":0,"lab":0,"desc":"","teaser":"","improve":"","req":[],"props":[]},{"id":"05202","name":"NOT AVAILABLE","cat":0,"eden":-1,"ply":-1,"sci":0,"lab":0,"desc":"","teaser":"","improve":"","req":[],"props":[]},{"id":"05602","name":"NOT AVAILABLE","cat":0,"eden":-1,"ply":-1,"sci":0,"lab":0,"desc":"","teaser":"","improve":"","req":[],"props":[]},{"id":"05701","name":"NOT AVAILABLE","cat":0,"eden":-1,"ply":-1,"sci":0,"lab":0,"desc":"","teaser":"","improve":"","req":[],"props":[]},{"id":"07103","name
